# Nginx — DESENVOLVIMENTO (HTTP na porta 80 do container; host publica 8080)

server {
    listen 80;
    server_name _;

    # Sem versão no header `Server` nem nas páginas de erro do nginx
    # (divulgar a versão exata só encurta a busca por CVE de quem varre).
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o front controller executa PHP (padrão da documentação oficial do
    # Laravel para nginx). O resto do `public/` é estático: `/wp-login.php`,
    # `/xmlrpc.php`, um `.php` esquecido num upload ou em `public/vendor` —
    # nada disso chega ao php-fpm. Com o antigo `location ~ \.php$`, qualquer
    # `.php` ia direto ao php-fpm SEM passar pelo Laravel (logo, sem
    # EdgeRateLimit e sem trilha): varredura barata direto no pool de workers.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Defesa em profundidade: o `expose_php = Off` do php.ini já tira
        # este header; se alguém reverter o ini, a borda ainda não o repassa.
        fastcgi_hide_header X-Powered-By;

        # Quem é o cliente, e por que a borda TEM de dizer isso.
        #
        # O php-fpm só vê a conexão do nginx, então sem estes três parâmetros o
        # `ip()` da aplicação é o IP DESTE container (e a allowlist do /admin, o
        # rate limiting e a trilha de auditoria comparam e gravam o endereço
        # errado). Quem obedece estes headers é a declaração TRUSTED_PROXIES —
        # ver Twstec\Kit\Foundation\Http\TrustedProxies.
        #
        # `$proxy_add_x_forwarded_for` é o ponto central: ele ANEXA o endereço
        # real da conexão ao que o cliente mandou, em vez de repassar o valor do
        # cliente. Como o Laravel toma como cliente a última entrada que não é de
        # proxy confiável, o endereço anexado aqui é o que vale e o inventado
        # pelo cliente é descartado. Sem isto, declarar este nginx confiável
        # PERMITIRIA forjar IP — seria pior que não declarar nada.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        # Sobrescreve (não repassa) o que o cliente enviar: o host visto aqui, e
        # nada mais. O header só é obedecido com TRUSTED_PROXY_TRUST_FORWARDED_HOST.
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        include fastcgi_params;
    }

    # Qualquer outro `.php` morre aqui, com 404 do próprio nginx: não chega
    # ao php-fpm nem ao Laravel. Deliberadamente SEM `error_page 404
    # /index.php` — isso reenviaria cada varredura para dentro da aplicação.
    location ~ \.php$ {
        return 404;
    }

    # Nunca servir arquivos ocultos (.env, .git...).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
