# Nginx — PRODUÇÃO (80 → redirect HTTPS; 443 TLS + headers de segurança OWASP)

# Sem versão no header `Server` nem nas páginas de erro do nginx, nos DOIS
# server blocks (o do 80 também responde — redirect e ACME). Declarado no
# nível http (este arquivo é incluído dentro do bloco http do nginx.conf).
server_tokens off;

server {
    listen 80;
    server_name _;

    # ACME/Let's Encrypt (se um dia usar) e redirect geral para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado autoassinado gerado no build da imagem (docker/nginx/Dockerfile).
    # Em produção real, montar certificados válidos neste caminho via volume.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Headers de segurança (referência: OWASP Secure Headers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o front controller executa PHP (padrão da documentação oficial do
    # Laravel para nginx). O resto do `public/` é estático: `/wp-login.php`,
    # `/xmlrpc.php`, um `.php` esquecido num upload ou em `public/vendor` —
    # nada disso chega ao php-fpm. Com o antigo `location ~ \.php$`, qualquer
    # `.php` ia direto ao php-fpm SEM passar pelo Laravel (logo, sem
    # EdgeRateLimit e sem trilha): varredura barata direto no pool de workers.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        # Defesa em profundidade: o `expose_php = Off` do php.ini já tira
        # este header; se alguém reverter o ini, a borda ainda não o repassa.
        fastcgi_hide_header X-Powered-By;

        # Quem é o cliente, e por que a borda TEM de dizer isso — a explicação
        # inteira está no dev.conf e em Twstec\Kit\Foundation\Http\TrustedProxies. Em resumo:
        # `$proxy_add_x_forwarded_for` ANEXA o endereço real da conexão ao valor
        # que o cliente mandou, e é isso que torna o header inforjável para quem
        # declarou este nginx em TRUSTED_PROXIES.
        #
        # Nota sobre o esquema: o `HTTPS on` acima já basta para o PHP ver
        # https, porque este server block É o TLS; o X-Forwarded-Proto vai como
        # `$scheme` (https aqui) e SOBRESCREVE o que o cliente mandar, que é a
        # afirmação verdadeira — esta conexão é TLS. Instalação com outra borda
        # na frente terminando TLS e falando http com esta origem precisa ajustar
        # este server block para o próprio cenário (é a mesma decisão do redirect
        # 80→443 acima, que também assume TLS terminando aqui).
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        include fastcgi_params;
    }

    # Qualquer outro `.php` morre aqui, com 404 do próprio nginx: não chega
    # ao php-fpm nem ao Laravel. Deliberadamente SEM `error_page 404
    # /index.php` — isso reenviaria cada varredura para dentro da aplicação.
    location ~ \.php$ {
        return 404;
    }

    # Nunca servir arquivos ocultos (.env, .git...).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
