; Configuração PHP — DESENVOLVIMENTO
; Erros visíveis e opcache com revalidação a cada requisição (código via volume).

memory_limit = 512M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

upload_max_filesize = 20M
post_max_size = 25M

; Sem `X-Powered-By: PHP/8.4.x` nas respostas — igual à produção, para o
; ambiente de dev não esconder um vazamento de versão que produção não teria.
expose_php = Off

; Em dev o código muda o tempo todo (volume bind): revalidar sempre.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Sessões seguras (vale também para dev, para não mascarar problema de config).
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Mitigação da CVE-2026-115560 (RCE no progresso de upload da sessão nativa
; do PHP, ainda sem correção — o 8.4.27 não corrige): a recomendação oficial
; é desligar o recurso até a próxima versão de correção. O Laravel não usa a
; sessão nativa do PHP: nada muda na aplicação.
; https://seclists.org/oss-sec/2026/q4/359
session.upload_progress.enabled = 0
