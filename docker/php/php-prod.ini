; Configuração PHP — PRODUÇÃO
; Nunca exibir erros ao cliente (vazamento de stack trace/caminhos).

memory_limit = 256M

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

upload_max_filesize = 20M
post_max_size = 25M

; Sem `X-Powered-By: PHP/8.4.x` nas respostas (o nginx também esconde o
; header — fastcgi_hide_header — como segunda camada).
expose_php = Off

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
