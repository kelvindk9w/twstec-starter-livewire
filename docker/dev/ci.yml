# =============================================================================
# CI do projeto — o mesmo conjunto do `scripts/verificar` (que roda local, no
# Docker): Pint (estilo), análise estática (Larastan), auditorias de
# dependências (Composer e npm), o build do front e a suíte Pest contra o
# PostgreSQL 18 (o banco de produção).
#
# QUANDO RODA: à mão (aba Actions → CI → "Run workflow") e uma vez por semana
# (segunda, 06:00 UTC — pega dependência com falha de segurança nova mesmo sem
# commit). Não roda a cada push de propósito: repositório privado tem cota de
# minutos do Actions. Para rodar a cada push e pull request, acrescente em
# `on:` (e, se quiser, exija o check na proteção da branch):
#
#   push:
#     branches: [main]
#   pull_request:
#
# SEGURANÇA: permissão só de leitura; as ações de terceiros fixadas pelo
# commit (a versão fica no comentário ao lado — atualize os dois juntos); o
# checkout não guarda a credencial do GitHub no disco.
#
# O banco da suíte é o que o phpunit.pgsql.xml força (<banco>_test): o passo
# "Banco de teste" o lê de lá e o cria no PostgreSQL do job.
#
# E2E (opcional, só no disparo manual — marque "Rodar também o E2E"): o job
# `e2e` sobe o Docker de desenvolvimento do projeto (compose.yaml) numa
# máquina limpa, com um .env EFÊMERO gerado no próprio job (o nome e as
# portas tirados da APP_URL do .env.example; senhas e chaves aleatórias,
# descartadas no fim) — nenhum segredo do repositório — e roda o
# `scripts/e2e`, o mesmo da máquina (`scripts/verificar --e2e`).
# =============================================================================
name: CI

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Rodar também o E2E (Playwright) no Docker de desenvolvimento'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Pint · Larastan · auditorias · build · Pest (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variáveis do processo vencem o .env; o nome do banco vem forçado pelo
    # phpunit.pgsql.xml. O papel de migração é o mesmo usuário do serviço
    # (dono do banco de teste): a suíte roda com ele, e os testes da
    # separação de papéis criam o papel de aplicação deles.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_MIGRATION_USERNAME: ci
      DB_MIGRATION_PASSWORD: ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, gd, bcmath, zip, pcntl, posix, mbstring, redis
          coverage: none

      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Análise estática (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Auditoria de dependências PHP
        run: composer audit --no-interaction

      - name: Dependências Node
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Auditoria de dependências Node
        run: npm audit --omit=dev --audit-level=high

      - name: Build do front
        run: npm run build

      - name: Ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Banco de teste
        run: |
          database=$(sed -n 's/.*<env name="DB_DATABASE" value="\([^"]*\)".*/\1/p' phpunit.pgsql.xml | head -n 1)
          test -n "$database"
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d ci -c "CREATE DATABASE \"$database\""

      - name: Testes (Pest · PostgreSQL 18)
        run: ./vendor/bin/pest --ci -c phpunit.pgsql.xml

  e2e:
    name: E2E (Playwright · Docker de desenvolvimento)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # O .env do Docker de desenvolvimento, como o instalador grava na
      # criação: o nome e a porta do site vêm da APP_URL do .env.example
      # (http://<nome>.localhost:<porta>), as outras portas seguem a do site
      # (808N → e-mails 802N, Vite 803N, banco 804N), o dono dos arquivos é o
      # usuário do job, e as senhas e chaves são geradas aqui, só para este
      # job.
      - name: .env efêmero
        run: |
          cp .env.example .env
          url=$(sed -n 's/^APP_URL=//p' .env.example | tail -n 1)
          name=$(printf '%s' "$url" | sed -n 's|^http://\([a-z0-9-]*\)\.localhost:[0-9]*$|\1|p')
          port=${url##*:}
          if [ -z "$name" ]; then echo "APP_URL do .env.example fora do padrão http://<nome>.localhost:<porta>: $url"; exit 1; fi
          set_env() {
            if grep -q "^$1=" .env; then
              awk -v key="$1" -v value="$2" 'index($0, key "=") == 1 { print key "=" value; next } { print }' .env > .env.tmp
              mv .env.tmp .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          set_env COMPOSE_PROJECT_NAME "$name"
          set_env COMPOSE_PROFILES ''
          set_env DEV_SITE_PORT "$port"
          set_env DEV_MAIL_PORT "$((port - 60))"
          set_env DEV_VITE_PORT "$((port - 50))"
          set_env DEV_DB_PORT "$((port - 40))"
          set_env DEV_UID "$(id -u)"
          set_env DEV_GID "$(id -g)"
          set_env APP_KEY "base64:$(openssl rand -base64 32)"
          set_env DB_PASSWORD "$(openssl rand -hex 16)"
          set_env DB_MIGRATION_PASSWORD "$(openssl rand -hex 16)"
          set_env REDIS_PASSWORD "$(openssl rand -hex 16)"
          set_env API_KEYS_HASH_PEPPER "$(openssl rand -hex 32)"
          set_env UPLOADS_ENCRYPTION_KEY "base64:$(openssl rand -base64 32)"
          set_env RATE_LIMIT_SENSITIVE 30
          echo "projeto $name: http://$name.localhost:$port"

      - name: E2E (scripts/e2e)
        run: scripts/e2e

      - name: Logs do ambiente (se falhar)
        if: failure()
        run: docker compose logs --tail=200
