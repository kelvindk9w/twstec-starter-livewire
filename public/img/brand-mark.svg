  <rect x="1" y="1" width="30" height="30" rx="8" stroke="currentColor" stroke-width="2"/>
  <path d="M9 11h14M16 11v11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
